name: 'Install Podman machine'
description: >
  Installs Podman and initializes/starts the Podman machine on the remote host via the
  e2e-runner image, without checking out the application under test or running any tests.
  Runs the same e2e-runner image and script as run-playwright-test, using its
  `-installOnly` mode, so that Podman installation failures show up as a distinct,
  easy-to-debug CI step separate from test execution. run-playwright-test can then be
  called afterwards without a podman-download-url, since Podman is already on the
  remote host's PATH.
inputs:
  runner-image:
    description: 'Base name for the e2e-runner container image.'
    required: false
    default: 'ghcr.io/podman-desktop/e2e-runner'
  target-folder:
    description: 'The target folder on the remote host where the build will occur.'
    required: false
    default: 'pd-e2e'
  results-folder:
    description: 'The folder for storing build results on the remote host.'
    required: false
    default: 'results'
  e2e-runner-tag:
    description: 'Tag for the e2e-runner container image (without OS suffix).'
    required: true
  podman-download-url:
    description: 'URL for e2e-runner to download and install Podman on the remote host.'
    required: true
  podman-provider:
    description: 'The Podman provider to use for the tests (e.g., wsl, hyperv).'
    required: false
    default: ''
  podman-init:
    description: 'Whether to initialize the Podman machine.'
    required: false
    default: '1'
  podman-start:
    description: 'Whether to start the Podman machine.'
    required: false
    default: '1'
  rootful:
    description: 'Whether to initialize the Podman machine as rootful.'
    required: false
    default: '1'
  user-networking:
    description: 'Whether to enable user-mode networking on the Podman machine.'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Install and initialize Podman machine
      shell: bash
      run: |
        USER_NETWORKING_PARAM=""
        if [ -n "${{ inputs.user-networking }}" ]; then
          USER_NETWORKING_PARAM="-userNetworking ${{ inputs.user-networking }}"
        fi

        podman run -d --name e2e-runner-install-podman \
          -e TARGET_HOST=$(cat host) \
          -e TARGET_HOST_USERNAME=$(cat username) \
          -e TARGET_HOST_KEY_PATH=/data/id_rsa \
          -e TARGET_FOLDER=${{ inputs.target-folder }} \
          -e TARGET_RESULTS=${{ inputs.results-folder }} \
          -e OUTPUT_FOLDER=/data \
          -e DEBUG=true \
          -v $PWD:/data:z \
          ${{ inputs.runner-image }}:${{ inputs.e2e-runner-tag }}-windows \
              pd-e2e/runner.ps1 \
                -installOnly 1 \
                -targetFolder ${{ inputs.target-folder }} \
                -resultsFolder ${{ inputs.results-folder }} \
                -podmanDownloadUrl ${{ inputs.podman-download-url }} \
                -initialize ${{ inputs.podman-init }} \
                -start ${{ inputs.podman-start }} \
                -rootful ${{ inputs.rootful }} \
                ${USER_NETWORKING_PARAM} \
                -podmanProvider ${{ inputs.podman-provider }}

        # check logs
        podman logs -f e2e-runner-install-podman
